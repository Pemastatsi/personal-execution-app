name: Astra concept · APK and visual QA

on:
  pull_request:
    paths: ['prototypes/astra/**', '.github/workflows/astra-concept.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/astra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded
        if: ${{ !cancelled() }}
      - name: Render actual Flutter screens at 390 × 844
        if: ${{ !cancelled() }}
        run: flutter test test/render_test.dart --dart-define=EXPORT_SCREENSHOTS=true --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-visual-qa
          path: |
            prototypes/astra/screenshots/*.png
            prototypes/astra/pubspec.lock
            prototypes/astra/lib/
            prototypes/astra/test/
          retention-days: 30
      - run: flutter build apk --debug
        id: build
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ steps.build.outcome == 'success' }}
        with:
          name: astra-android-debug
          path: prototypes/astra/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
